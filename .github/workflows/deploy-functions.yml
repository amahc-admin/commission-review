name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Settings -> Secrets and variables -> Actions -> New repository secret.
      # Create the token at https://supabase.com/dashboard/account/tokens
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test the overnight read
        run: deno test --allow-env supabase/functions/overnight-read/

      - name: Skip deploy until the token is set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::Tests passed. Add the SUPABASE_ACCESS_TOKEN repo secret to deploy (SETUP.md)."

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest

      - name: Deploy overnight-read
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy overnight-read --project-ref wumotelrvysafszdxldw --no-verify-jwt
